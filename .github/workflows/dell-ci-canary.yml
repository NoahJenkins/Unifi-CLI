name: Dell CI canary

on:
  workflow_dispatch:
    inputs:
      behavior:
        description: Harmless test behavior
        type: choice
        options: [success, failure, hold]
        default: success

permissions:
  contents: read

concurrency:
  group: dell-ci-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canary:
    name: Dell canary (${{ matrix.profile }})
    if: >-
      github.repository == 'NoahJenkins/Unifi-CLI' &&
      github.actor == 'NoahJenkins' &&
      github.triggering_actor == 'NoahJenkins' &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: ubuntu24
            runner: optiplex-ci-ubuntu24
    steps:
      - name: verify disposable guest identity
        env:
          EXPECTED_RUNNER_PROFILE: ${{ matrix.profile }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, stat
          def require(condition):
              if not condition:
                  raise SystemExit('Guest identity verification failed')
          def verify_profile(path, expected):
              marker = path.lstat()
              require(stat.S_ISREG(marker.st_mode) and marker.st_uid == 0 and not os.access(path, os.W_OK))
              profile = path.read_text().strip()
              require(profile == expected)
              return profile
          def verify_port(path):
              link = path.lstat()
              require(stat.S_ISLNK(link.st_mode) and link.st_uid == 0)
              verify_parents(path)
              port = path.stat()
              require(stat.S_ISCHR(port.st_mode) and port.st_uid == os.geteuid() and stat.S_IMODE(port.st_mode) == 0o600)
          def verify_parents(path):
              for parent in path.parents:
                  info = parent.lstat()
                  require(stat.S_ISDIR(info.st_mode) and info.st_uid == 0 and not os.access(parent, os.W_OK))
          def verify_hook(path):
              hook = path.lstat()
              require(stat.S_ISREG(hook.st_mode) and hook.st_uid == 0 and stat.S_IMODE(hook.st_mode) == 0o555)
              verify_parents(path)
          def verify_mounts(lines):
              require(not any(line.split()[2] in {'9p', 'virtiofs', 'nfs', 'nfs4', 'cifs'} for line in lines))
          require(os.geteuid() != 0)
          profile = verify_profile(pathlib.Path('/opt/dell-ci/profile'), os.environ['EXPECTED_RUNNER_PROFILE'])
          verify_hook(pathlib.Path('/opt/dell-ci/admit.sh'))
          verify_port(pathlib.Path('/dev/virtio-ports/dell-ci.admission'))
          require(not pathlib.Path('/run/dell-ci-jit').exists())
          require(not pathlib.Path('/etc/dell-ci/credentials/github-app.pem').exists())
          verify_mounts(pathlib.Path('/proc/mounts').read_text().splitlines())
          evidence = {key: os.environ[key] for key in ['GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'RUNNER_NAME', 'RUNNER_OS', 'RUNNER_ARCH']}
          evidence.update({'profile': profile, 'guest_checks_passed': True})
          pathlib.Path('dell-ci-canary.json').write_text(json.dumps(evidence) + '\n')
          PYTHON
      - name: retain canary identity evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dell-ci-canary-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dell-ci-canary.json
          if-no-files-found: error
          retention-days: 1
      - name: requested failure test
        if: inputs.behavior == 'failure'
        run: exit 1
      - name: wait for an operator cancellation or restart test
        if: inputs.behavior == 'hold'
        run: sleep 180
