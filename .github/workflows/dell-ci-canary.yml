name: Dell CI canary

on:
  workflow_dispatch:
    inputs:
      behavior:
        description: Harmless test behavior
        type: choice
        options: [success, failure, hold]
        default: success

permissions:
  contents: read

concurrency:
  group: dell-ci-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canary:
    name: Dell canary (${{ matrix.profile }})
    if: >-
      github.repository == 'NoahJenkins/Unifi-CLI' &&
      github.actor == 'NoahJenkins' &&
      github.triggering_actor == 'NoahJenkins' &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: ubuntu24
            runner: optiplex-ci-ubuntu24
    steps:
      - name: verify disposable guest identity
        env:
          EXPECTED_RUNNER_PROFILE: ${{ matrix.profile }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, stat
          assert os.geteuid() != 0
          profile = pathlib.Path('/opt/dell-ci/profile').read_text().strip()
          assert profile == os.environ['EXPECTED_RUNNER_PROFILE']
          hook = pathlib.Path('/opt/dell-ci/admit.sh').stat()
          assert hook.st_uid == 0 and stat.S_IMODE(hook.st_mode) == 0o555
          port = pathlib.Path('/dev/virtio-ports/dell-ci.admission').stat()
          assert port.st_uid == os.geteuid() and stat.S_IMODE(port.st_mode) == 0o600
          assert not pathlib.Path('/run/dell-ci-jit').exists()
          assert not pathlib.Path('/etc/dell-ci/credentials/github-app.pem').exists()
          assert not any(line.split()[2] in {'9p', 'virtiofs', 'nfs', 'cifs'} for line in pathlib.Path('/proc/mounts').read_text().splitlines())
          evidence = {key: os.environ[key] for key in ['GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'RUNNER_NAME', 'RUNNER_OS', 'RUNNER_ARCH']}
          evidence.update({'profile': profile, 'guest_checks_passed': True})
          pathlib.Path('dell-ci-canary.json').write_text(json.dumps(evidence) + '\n')
          PYTHON
      - name: retain canary identity evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dell-ci-canary-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dell-ci-canary.json
          if-no-files-found: error
          retention-days: 1
      - name: requested failure test
        if: inputs.behavior == 'failure'
        run: exit 1
      - name: wait for an operator cancellation or restart test
        if: inputs.behavior == 'hold'
        run: sleep 180
