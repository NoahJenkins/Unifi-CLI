name: Dependabot Controller

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [CI, Release]
    types: [completed]
  status:
  schedule:
    - cron: '17,47 * * * *'
    - cron: '11 8 * * *'
  workflow_dispatch:

# Trusted checkouts are immutable workflow source; candidate code runs only in a secret-free container.
permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  actions: read

concurrency:
  group: dependabot-controller-${{ github.repository }}
  cancel-in-progress: false

env:
  DEPENDABOT_CONTROLLER_APP_ID: ${{ vars.DEPENDABOT_CONTROLLER_APP_ID }}
  DEPENDABOT_STATE_ISSUE_NUMBER: ${{ vars.DEPENDABOT_STATE_ISSUE_NUMBER }}
  DEPENDABOT_AUTOMATION_ENABLED: ${{ vars.DEPENDABOT_AUTOMATION_ENABLED }}
  DEPENDABOT_AGENT_ENABLED: ${{ vars.DEPENDABOT_AGENT_ENABLED }}
  GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}

jobs:
  setup-required:
    name: Dependabot setup required
    timeout-minutes: 2
    if: vars.DEPENDABOT_CONTROLLER_APP_ID == '' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '11 8 * * *')
    runs-on: ubuntu-latest
    steps:
      - name: Explain inactive automation
        shell: bash
        run: |
          echo '::warning::Dependabot automation is inactive: dedicated controller App configuration is missing.'
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Dependabot automation is inactive

          The controller cannot review, repair, or merge PRs until its dedicated
          App, state issue, environment credentials, and enable flags are configured.
          Passing CI alone does not enable auto-merge. The current policy keeps
          blocked PRs open for review; it does not auto-close major updates.

          Follow docs/maintainers/dependabot-recovery.md before activation.
          SUMMARY

  controller:
    name: Reconcile Dependabot PRs
    if: vars.DEPENDABOT_CONTROLLER_APP_ID != '' && github.ref == 'refs/heads/main'
    environment: dependabot-controller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tasks: ${{ steps.reconcile.outputs.tasks }}
      has_tasks: ${{ steps.reconcile.outputs.has_tasks }}
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Create scoped controller App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DEPENDABOT_CONTROLLER_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_CONTROLLER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: write
          permission-administration: read
      - name: Reconcile current heads
        id: reconcile
        run: node trusted/.github/scripts/dependabot-controller-run.cjs controller
        env:
          DEPENDABOT_READ_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPENDABOT_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPENDABOT_CONTROLLER_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

  claim:
    name: Claim reserved tasks
    needs: controller
    if: always() && !cancelled() && needs.controller.outputs.has_tasks == 'true' && github.run_attempt == 1 && github.ref == 'refs/heads/main'
    environment: dependabot-controller
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tasks: ${{ steps.claim.outputs.tasks }}
      has_tasks: ${{ steps.claim.outputs.has_tasks }}
      app_slug: ${{ steps.app-token.outputs.app-slug }}
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Create scoped controller App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DEPENDABOT_CONTROLLER_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_CONTROLLER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: read
          permission-administration: read
      - name: Persist claims before launch
        id: claim
        run: node trusted/.github/scripts/dependabot-controller-run.cjs claim
        env:
          DEPENDABOT_READ_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPENDABOT_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPENDABOT_CONTROLLER_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          DEPENDABOT_TASKS: ${{ needs.controller.outputs.tasks }}

  worker:
    name: Copilot worker (${{ matrix.task.nonce }})
    needs: claim
    if: always() && !cancelled() && needs.claim.outputs.has_tasks == 'true' && github.run_attempt == 1 && github.ref == 'refs/heads/main'
    environment: dependabot-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.claim.outputs.tasks) }}
    env:
      DEPENDABOT_TASK: ${{ toJSON(matrix.task) }}
      DEPENDABOT_CONTROLLER_APP_SLUG: ${{ needs.claim.outputs.app_slug }}
      DEPENDABOT_DATA_DIR: ${{ github.workspace }}/.dependabot-data
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Prepare complete bounded input without provider credentials
        run: node trusted/.github/scripts/dependabot-controller-run.cjs prepare
        env:
          DEPENDABOT_READ_TOKEN: ${{ github.token }}
      - name: Install verified pinned Copilot runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/copilot-bin"
          curl --fail --location --proto '=https' --silent --show-error https://github.com/github/copilot-cli/releases/download/v1.0.85/copilot-linux-x64.tar.gz -o "$RUNNER_TEMP/copilot-bin/runtime.tar.gz"
          echo '6f235cea897645eef67e8f480e36a15b5d9c9f7a6165ebc9b6b1c28afc8bcdda  '"$RUNNER_TEMP/copilot-bin/runtime.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/copilot-bin/runtime.tar.gz" -C "$RUNNER_TEMP/copilot-bin"
      - name: Verify restricted Copilot data tool without credentials
        run: node trusted/.github/scripts/copilot-smoke.cjs
        env:
          COPILOT_BINARY: ${{ runner.temp }}/copilot-bin/copilot
      - name: Run isolated bounded Copilot session
        run: node trusted/.github/scripts/dependabot-controller-run.cjs worker
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_BINARY: ${{ runner.temp }}/copilot-bin/copilot
      - name: Retain sanitized model usage separately from trusted result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: copilot-usage-${{ matrix.task.nonce }}
          path: ${{ github.workspace }}/.dependabot-data/session/usage.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload wrapper-owned data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-${{ matrix.task.nonce }}
          path: ${{ github.workspace }}/.dependabot-data/result.json
          if-no-files-found: error
          retention-days: 3

  validate:
    name: Copilot validation (${{ matrix.task.nonce }})
    needs: [claim, worker]
    if: always() && !cancelled() && needs.claim.outputs.has_tasks == 'true' && github.run_attempt == 1 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.claim.outputs.tasks) }}
    env:
      DEPENDABOT_TASK: ${{ toJSON(matrix.task) }}
      DEPENDABOT_CONTROLLER_APP_SLUG: ${{ needs.claim.outputs.app_slug }}
      DEPENDABOT_DATA_DIR: ${{ github.workspace }}/.dependabot-validation
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Checkout candidate data without persistent credentials
        if: matrix.task.kind == 'repair'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ matrix.task.head }}
          persist-credentials: false
          path: candidate
      - name: Build trusted secret-free validator
        if: matrix.task.kind == 'repair'
        run: docker build --platform linux/amd64 -t dependabot-validator -f trusted/.github/opencode/validator.Dockerfile trusted
      - name: Validate bounded output in a fresh job
        run: node trusted/.github/scripts/dependabot-controller-run.cjs validate
        env:
          DEPENDABOT_READ_TOKEN: ${{ github.token }}
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          VALIDATOR_IMAGE: dependabot-validator
      - name: Upload validated data and digest chain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-${{ matrix.task.nonce }}
          path: ${{ github.workspace }}/.dependabot-validation/result.json
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish authenticated results
    needs: [claim, worker, validate]
    if: always() && !cancelled() && needs.claim.outputs.has_tasks == 'true' && github.run_attempt == 1 && github.ref == 'refs/heads/main'
    environment: dependabot-controller
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Create scoped controller App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DEPENDABOT_CONTROLLER_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_CONTROLLER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: read
          permission-administration: read
      - name: Verify provenance and publish once
        run: node trusted/.github/scripts/dependabot-controller-run.cjs publish
        env:
          DEPENDABOT_READ_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPENDABOT_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPENDABOT_CONTROLLER_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          DEPENDABOT_TASKS: ${{ needs.claim.outputs.tasks }}

  reconcile:
    name: Recheck gates after publication
    needs: [claim, publish]
    if: always() && !cancelled() && needs.claim.outputs.has_tasks == 'true' && github.ref == 'refs/heads/main'
    environment: dependabot-controller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Create scoped controller App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DEPENDABOT_CONTROLLER_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_CONTROLLER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: write
          permission-administration: read
      - name: Reconcile without reserving more work in this run
        run: node trusted/.github/scripts/dependabot-controller-run.cjs controller
        env:
          DEPENDABOT_READ_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPENDABOT_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPENDABOT_CONTROLLER_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          DEPENDABOT_AGENT_ENABLED: 'false'
