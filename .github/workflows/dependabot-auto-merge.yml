name: Dependabot auto-merge

# Squash auto-merge for Dependabot patch and minor updates and for GitHub
# Actions updates. Majors get the needs-review label and wait for a human.
# Runs on pull_request_target so Dependabot PRs get a write-capable token
# without any secret; the job never checks out or runs pull request code. The
# merge itself is made by GitHub once the required checks pass. Merges made
# with GITHUB_TOKEN do not start push workflows; nothing here depends on one.
# This workflow does not approve pull requests.

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-lookup: false

      - name: Enable auto-merge for safe dependency updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job does not check out the repository. GH_REPO selects it for every gh command.
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          set -euo pipefail

          eligible=false
          if [[ "$ECOSYSTEM" == "github_actions" || "$ECOSYSTEM" == "github-actions" ]]; then
            eligible=true
          elif [[ "$UPDATE_TYPE" == "version-update:semver-patch" || "$UPDATE_TYPE" == "version-update:semver-minor" ]]; then
            eligible=true
          fi

          if [[ "$eligible" == true ]]; then
            if gh pr merge --auto --squash "$PR_URL"; then
              exit 0
            fi
            method="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest.mergeMethod // ""')"
            if [[ "$method" == "SQUASH" ]]; then
              exit 0
            fi
            echo "Could not enable squash auto-merge." >&2
            exit 1
          fi

          if [[ "$UPDATE_TYPE" == "version-update:semver-major" ]]; then
            gh label create needs-review --description "Major dependency update awaiting review" --color "ededed" >/dev/null 2>&1 || true
            gh pr edit "$PR_URL" --add-label needs-review >/dev/null 2>&1 || true
            echo "Major update left for review."
            exit 0
          fi

          echo "Update left for review (update-type=${UPDATE_TYPE}, ecosystem=${ECOSYSTEM})."
