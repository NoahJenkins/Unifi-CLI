name: Dependabot auto-merge

# Squash auto-merge for Dependabot patch, minor, and security updates, and for
# GitHub Actions updates. Major module updates stay open. Auto-merge waits for
# required checks; this workflow does not approve pull requests.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for safe dependency updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          ALERT_STATE: ${{ steps.metadata.outputs.alert-state }}
          DEPS_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          security=false
          case "$ALERT_STATE" in
            OPEN|FIXED) security=true ;;
          esac
          if printf '%s\n%s\n' "$PR_BODY" "$DEPS_JSON" | grep -Eq 'GHSA-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4}|This update includes a security fix|This update includes security fixes|This is a security update'; then
            security=true
          fi

          eligible=false
          if [[ "$ECOSYSTEM" == "github_actions" || "$ECOSYSTEM" == "github-actions" ]]; then
            eligible=true
          elif [[ "$UPDATE_TYPE" == "version-update:semver-patch" || "$UPDATE_TYPE" == "version-update:semver-minor" ]]; then
            eligible=true
          elif [[ "$security" == true ]]; then
            eligible=true
          fi

          if [[ "$eligible" == true ]]; then
            if gh pr merge --auto --squash "$PR_URL"; then
              exit 0
            fi
            method="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest.mergeMethod // ""')"
            if [[ "$method" == "SQUASH" ]]; then
              exit 0
            fi
            echo "Could not enable squash auto-merge." >&2
            exit 1
          fi

          if [[ "$UPDATE_TYPE" == "version-update:semver-major" ]]; then
            gh label create needs-review --description "Major dependency update awaiting review" --color "ededed" >/dev/null 2>&1 || true
            gh pr edit "$PR_URL" --add-label needs-review >/dev/null 2>&1 || true
            echo "Major update left for review."
            exit 0
          fi

          echo "Update left for review (update-type=${UPDATE_TYPE}, ecosystem=${ECOSYSTEM})."
