name: Dependabot auto-merge

# Squash auto-merge for Dependabot patch and minor updates, and for every
# GitHub Actions update. A semver-major update auto-merges only when
# fetch-metadata reports an associated Dependabot alert (alert-state OPEN or
# FIXED, or a ghsa-id that is not DISMISSED). Release notes and the pull
# request body are not consulted. alert-lookup stays false unless the
# Dependabot secret DEPENDABOT_METADATA_TOKEN is set to a personal access
# token or GitHub App installation token that can read Dependabot alerts.
# Store that secret under Settings → Secrets and variables → Dependabot.
# Dependabot-triggered pull_request workflows cannot read Actions secrets.
# Without it, security majors stay for review. This workflow does not approve
# pull requests.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.DEPENDABOT_METADATA_TOKEN != '' && secrets.DEPENDABOT_METADATA_TOKEN || secrets.GITHUB_TOKEN }}
          alert-lookup: ${{ secrets.DEPENDABOT_METADATA_TOKEN != '' }}

      - name: Enable auto-merge for safe dependency updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          ALERT_STATE: ${{ steps.metadata.outputs.alert-state }}
          GHSA_ID: ${{ steps.metadata.outputs.ghsa-id }}
        run: |
          set -euo pipefail

          security=false
          case "$ALERT_STATE" in
            OPEN|FIXED) security=true ;;
          esac
          if [[ -n "$GHSA_ID" && "$ALERT_STATE" != "DISMISSED" ]]; then
            security=true
          fi

          eligible=false
          if [[ "$ECOSYSTEM" == "github_actions" || "$ECOSYSTEM" == "github-actions" ]]; then
            eligible=true
          elif [[ "$UPDATE_TYPE" == "version-update:semver-patch" || "$UPDATE_TYPE" == "version-update:semver-minor" ]]; then
            eligible=true
          elif [[ "$security" == true ]]; then
            eligible=true
          fi

          if [[ "$eligible" == true ]]; then
            if gh pr merge --auto --squash "$PR_URL"; then
              exit 0
            fi
            method="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest.mergeMethod // ""')"
            if [[ "$method" == "SQUASH" ]]; then
              exit 0
            fi
            echo "Could not enable squash auto-merge." >&2
            exit 1
          fi

          if [[ "$UPDATE_TYPE" == "version-update:semver-major" ]]; then
            gh label create needs-review --description "Major dependency update awaiting review" --color "ededed" >/dev/null 2>&1 || true
            gh pr edit "$PR_URL" --add-label needs-review >/dev/null 2>&1 || true
            echo "Major update left for review."
            exit 0
          fi

          echo "Update left for review (update-type=${UPDATE_TYPE}, ecosystem=${ECOSYSTEM})."
