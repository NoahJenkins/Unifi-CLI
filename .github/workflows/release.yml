name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to resume
        required: true
        type: string
      release_commit:
        description: Exact 40-character commit resolved by the release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  RELEASE_COMMIT: ${{ inputs.release_commit || github.sha }}

jobs:
  preflight:
    name: bind immutable release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate tag binding before checkout
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          RESOLVED_COMMIT="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
          test "$RESOLVED_COMMIT" = "$RELEASE_COMMIT"

      - name: Check out bound release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse published release replacement
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: GITHUB_REF_NAME="$RELEASE_TAG" GITHUB_SHA="$RELEASE_COMMIT" bash ./scripts/release-preflight.sh

  trusted_inputs:
    name: build isolated trusted inputs
    needs:
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      bundle_digest: ${{ steps.seal.outputs.digest }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build trusted all-target binaries and source manifest
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          RELEASE_COMMIT_TIMESTAMP="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          RELEASE_COMMIT_DATE="$(date -u -d "@$RELEASE_COMMIT_TIMESTAMP" +%Y-%m-%dT%H:%M:%SZ)"
          RELEASE_LDFLAGS="-s -w -X github.com/noahjenkins/unifi-cli/internal/buildinfo.Version=$RELEASE_VERSION -X github.com/noahjenkins/unifi-cli/internal/buildinfo.Commit=$RELEASE_COMMIT -X github.com/noahjenkins/unifi-cli/internal/buildinfo.BuildDate=$RELEASE_COMMIT_DATE"
          mkdir -p "$RUNNER_TEMP/unifi-trusted"
          for TARGET in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS="${TARGET%/*}"
            GOARCH="${TARGET#*/}"
            OUTPUT="$RUNNER_TEMP/unifi-trusted/${GOOS}_${GOARCH}/unifi"
            if [ "$GOOS" = windows ]; then
              OUTPUT="${OUTPUT}.exe"
            fi
            mkdir -p "$(dirname "$OUTPUT")"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "$RELEASE_LDFLAGS" -o "$OUTPUT" ./cmd/unifi
          done
          go run ./cmd/release-smoke --write-source-manifest "$RUNNER_TEMP/unifi-source-manifest.json" --expected-commit "$RELEASE_COMMIT"

      - name: Seal trusted input bundle
        id: seal
        shell: bash
        run: |
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/trusted-release.tar" unifi-trusted unifi-source-manifest.json
          DIGEST="$(shasum -a 256 "$RUNNER_TEMP/trusted-release.tar" | awk '{print $1}')"
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Transfer sealed trusted inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-release-${{ env.RELEASE_COMMIT }}
          path: ${{ runner.temp }}/trusted-release.tar
          if-no-files-found: error
          retention-days: 1

  generate:
    name: generate untrusted release artifacts
    needs:
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      bundle_digest: ${{ steps.seal.outputs.digest }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse moved tags or published release replacement
        run: GITHUB_REF_NAME="$RELEASE_TAG" GITHUB_SHA="$RELEASE_COMMIT" bash ./scripts/release-preflight.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install pinned Syft for archive SBOMs
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
        with:
          syft-version: v1.48.0

      - name: Build release artifacts without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --skip=publish --release-notes docs/releases/v1.0.0-rc.1.md

      - name: Seal generated artifact bundle
        id: seal
        shell: bash
        run: |
          tar -cf "$RUNNER_TEMP/generated-release.tar" dist
          DIGEST="$(shasum -a 256 "$RUNNER_TEMP/generated-release.tar" | awk '{print $1}')"
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Transfer generated artifact bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-release-${{ env.RELEASE_COMMIT }}
          path: ${{ runner.temp }}/generated-release.tar
          if-no-files-found: error
          retention-days: 1

  verify:
    name: compare isolated trusted and generated bundles
    needs:
      - trusted_inputs
      - generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      bundle_digest: ${{ steps.seal.outputs.digest }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download trusted input bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-release-${{ env.RELEASE_COMMIT }}
          path: ${{ runner.temp }}/release-downloads/trusted

      - name: Download generated artifact bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-release-${{ env.RELEASE_COMMIT }}
          path: ${{ runner.temp }}/release-downloads/generated

      - name: Verify bundle seals and extract
        shell: bash
        env:
          TRUSTED_BUNDLE_DIGEST: ${{ needs.trusted_inputs.outputs.bundle_digest }}
          GENERATED_BUNDLE_DIGEST: ${{ needs.generate.outputs.bundle_digest }}
        run: |
          [[ "$TRUSTED_BUNDLE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GENERATED_BUNDLE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$(shasum -a 256 "$RUNNER_TEMP/release-downloads/trusted/trusted-release.tar" | awk '{print $1}')" = "$TRUSTED_BUNDLE_DIGEST"
          test "$(shasum -a 256 "$RUNNER_TEMP/release-downloads/generated/generated-release.tar" | awk '{print $1}')" = "$GENERATED_BUNDLE_DIGEST"
          mkdir -p "$RUNNER_TEMP/release-inputs"
          go run ./cmd/release-smoke --extract-bundle "$RUNNER_TEMP/release-downloads/trusted/trusted-release.tar" --bundle-kind trusted --destination "$RUNNER_TEMP/release-inputs/trusted"
          go run ./cmd/release-smoke --extract-bundle "$RUNNER_TEMP/release-downloads/generated/generated-release.tar" --bundle-kind generated --destination "$RUNNER_TEMP/release-inputs/generated"

      - name: Verify generated artifacts against isolated trusted inputs
        shell: bash
        run: go run ./cmd/release-smoke --artifacts "$RUNNER_TEMP/release-inputs/generated/dist" --expected-version "${RELEASE_TAG#v}" --expected-commit "$RELEASE_COMMIT" --trusted-binaries "$RUNNER_TEMP/release-inputs/trusted/unifi-trusted" --trusted-source-manifest "$RUNNER_TEMP/release-inputs/trusted/unifi-source-manifest.json"

      - name: Seal verified release bundle
        id: seal
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/verified-bundle/.release-verification"
          cp -R "$RUNNER_TEMP/release-inputs/generated/dist" "$RUNNER_TEMP/verified-bundle/dist"
          cp -R "$RUNNER_TEMP/release-inputs/trusted/unifi-trusted" "$RUNNER_TEMP/verified-bundle/.release-verification/trusted"
          cp "$RUNNER_TEMP/release-inputs/trusted/unifi-source-manifest.json" "$RUNNER_TEMP/verified-bundle/.release-verification/source-manifest.json"
          tar -C "$RUNNER_TEMP/verified-bundle" -cf "$RUNNER_TEMP/verified-release.tar" dist .release-verification
          DIGEST="$(shasum -a 256 "$RUNNER_TEMP/verified-release.tar" | awk '{print $1}')"
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Transfer sealed verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-${{ env.RELEASE_COMMIT }}
          path: ${{ runner.temp }}/verified-release.tar
          if-no-files-found: error
          retention-days: 1

  smoke_artifacts:
    name: smoke ${{ matrix.goos }}/${{ matrix.goarch }} artifact
    needs:
      - verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: windows-2025
            goos: windows
            goarch: amd64
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download sealed verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-${{ env.RELEASE_COMMIT }}
          path: ${{ runner.temp }}/verified-download

      - name: Verify bundle seal on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          EXPECTED_BUNDLE_DIGEST: ${{ needs.verify.outputs.bundle_digest }}
        run: |
          [[ "$EXPECTED_BUNDLE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$(shasum -a 256 "$RUNNER_TEMP/verified-download/verified-release.tar" | awk '{print $1}')" = "$EXPECTED_BUNDLE_DIGEST"

      - name: Verify bundle seal on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_BUNDLE_DIGEST: ${{ needs.verify.outputs.bundle_digest }}
        run: |
          if ($env:EXPECTED_BUNDLE_DIGEST -notmatch '^[0-9a-f]{64}$') { throw "invalid verified release bundle digest" }
          $actual = (Get-FileHash "$env:RUNNER_TEMP/verified-download/verified-release.tar" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:EXPECTED_BUNDLE_DIGEST) { throw "verified release bundle digest mismatch" }

      - name: Extract and reverify transferred release bundle
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/verified"
          go run ./cmd/release-smoke --extract-bundle "$RUNNER_TEMP/verified-download/verified-release.tar" --bundle-kind verified --destination "$RUNNER_TEMP/verified/release"
          go run ./cmd/release-smoke --artifacts "$RUNNER_TEMP/verified/release/dist" --expected-version "${RELEASE_TAG#v}" --expected-commit "$RELEASE_COMMIT" --trusted-binaries "$RUNNER_TEMP/verified/release/.release-verification/trusted" --trusted-source-manifest "$RUNNER_TEMP/verified/release/.release-verification/source-manifest.json"

      - name: Execute archived binary smoke contract on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          ARCHIVE="$RUNNER_TEMP/verified/release/dist/unifi-cli_${RELEASE_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          SMOKE_DIR="$(mktemp -d)"
          tar -xf "$ARCHIVE" -C "$SMOKE_DIR"
          BINARY="$SMOKE_DIR/unifi-cli_${RELEASE_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}/unifi"
          go run ./cmd/release-smoke --binary "$BINARY" --expected-version "$RELEASE_VERSION" --expected-commit "$RELEASE_COMMIT"

      - name: Execute archived binary smoke contract on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseVersion = $env:RELEASE_TAG.Substring(1)
          $archive = Join-Path $env:RUNNER_TEMP "verified/release/dist/unifi-cli_${releaseVersion}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          $smokeDir = Join-Path $env:RUNNER_TEMP "archived-binary-smoke"
          New-Item -ItemType Directory -Path $smokeDir -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $smokeDir
          $binary = Join-Path $smokeDir "unifi-cli_${releaseVersion}_${{ matrix.goos }}_${{ matrix.goarch }}/unifi.exe"
          go run ./cmd/release-smoke --binary $binary --expected-version $releaseVersion --expected-commit $env:RELEASE_COMMIT

  attest:
    name: attest verified artifacts
    needs:
      - verify
      - smoke_artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download sealed verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-${{ env.RELEASE_COMMIT }}
          path: ${{ runner.temp }}/verified-download

      - name: Verify bundle seal, extract, and reverify
        shell: bash
        env:
          EXPECTED_BUNDLE_DIGEST: ${{ needs.verify.outputs.bundle_digest }}
        run: |
          [[ "$EXPECTED_BUNDLE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$(shasum -a 256 "$RUNNER_TEMP/verified-download/verified-release.tar" | awk '{print $1}')" = "$EXPECTED_BUNDLE_DIGEST"
          go run ./cmd/release-smoke --extract-bundle "$RUNNER_TEMP/verified-download/verified-release.tar" --bundle-kind verified --destination "$RUNNER_TEMP/verified"
          go run ./cmd/release-smoke --artifacts "$RUNNER_TEMP/verified/dist" --expected-version "${RELEASE_TAG#v}" --expected-commit "$RELEASE_COMMIT" --trusted-binaries "$RUNNER_TEMP/verified/.release-verification/trusted" --trusted-source-manifest "$RUNNER_TEMP/verified/.release-verification/source-manifest.json"
          mkdir -p "$RUNNER_TEMP/attest"
          cp "$RUNNER_TEMP/verified/dist/checksums.txt" "$RUNNER_TEMP/attest/checksums.txt"
          while read -r digest filename extra || [[ -n "${digest:-}${filename:-}${extra:-}" ]]; do
            test -z "${extra:-}"
            cp "$RUNNER_TEMP/verified/dist/$filename" "$RUNNER_TEMP/attest/$filename"
          done < "$RUNNER_TEMP/verified/dist/checksums.txt"

      - name: Write resumed exact-source provenance predicate
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_ID: ${{ github.workflow_ref }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          jq -n \
            --arg repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg release_tag "$RELEASE_TAG" \
            --arg release_commit "$RELEASE_COMMIT" \
            --arg workflow_commit "$WORKFLOW_COMMIT" \
            --arg workflow_ref "$WORKFLOW_REF" \
            --arg workflow_id "$GITHUB_SERVER_URL/$WORKFLOW_ID" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg repository_id "$REPOSITORY_ID" \
            --arg repository_owner_id "$REPOSITORY_OWNER_ID" \
            --arg invocation_id "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            '{
              buildDefinition: {
                buildType: "https://actions.github.io/buildtypes/workflow/v1",
                externalParameters: {
                  workflow: {
                    ref: $workflow_ref,
                    repository: $repository,
                    path: ".github/workflows/release.yml"
                  }
                },
                internalParameters: {
                  github: {
                    event_name: $event_name,
                    repository_id: $repository_id,
                    repository_owner_id: $repository_owner_id,
                    runner_environment: "github-hosted"
                  }
                },
                resolvedDependencies: [
                  {
                    uri: ("git+" + $repository + "@" + $workflow_ref),
                    digest: {gitCommit: $workflow_commit}
                  },
                  {
                    uri: ("git+" + $repository + "@refs/tags/" + $release_tag),
                    digest: {gitCommit: $release_commit}
                  }
                ]
              },
              runDetails: {
                builder: {id: $workflow_id},
                metadata: {invocationId: $invocation_id}
              }
            }' > "$RUNNER_TEMP/resumed-provenance.json"
          jq -e --arg commit "$WORKFLOW_COMMIT" '.buildDefinition.resolvedDependencies[0].digest.gitCommit == $commit' "$RUNNER_TEMP/resumed-provenance.json" >/dev/null
          jq -e --arg commit "$RELEASE_COMMIT" '.buildDefinition.resolvedDependencies[1].digest.gitCommit == $commit' "$RUNNER_TEMP/resumed-provenance.json" >/dev/null

      - name: Attest exact release assets from tag push
        if: github.event_name != 'workflow_dispatch'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{ runner.temp }}/attest/*.tar.gz
            ${{ runner.temp }}/attest/*.zip
            ${{ runner.temp }}/attest/*.sbom.json
            ${{ runner.temp }}/attest/checksums.txt

      - name: Attest resumed exact-source release assets
        if: github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{ runner.temp }}/attest/*.tar.gz
            ${{ runner.temp }}/attest/*.zip
            ${{ runner.temp }}/attest/*.sbom.json
            ${{ runner.temp }}/attest/checksums.txt
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/resumed-provenance.json

  prepare_publication:
    name: seal minimal publication bundle
    needs:
      - verify
      - attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      bundle_digest: ${{ steps.seal.outputs.digest }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download sealed verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-${{ env.RELEASE_COMMIT }}
          path: ${{ runner.temp }}/verified-download

      - name: Reverify and stage exact publication files
        shell: bash
        env:
          EXPECTED_BUNDLE_DIGEST: ${{ needs.verify.outputs.bundle_digest }}
        run: |
          [[ "$EXPECTED_BUNDLE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$(shasum -a 256 "$RUNNER_TEMP/verified-download/verified-release.tar" | awk '{print $1}')" = "$EXPECTED_BUNDLE_DIGEST"
          go run ./cmd/release-smoke --extract-bundle "$RUNNER_TEMP/verified-download/verified-release.tar" --bundle-kind verified --destination "$RUNNER_TEMP/verified"
          go run ./cmd/release-smoke --artifacts "$RUNNER_TEMP/verified/dist" --expected-version "${RELEASE_TAG#v}" --expected-commit "$RELEASE_COMMIT" --trusted-binaries "$RUNNER_TEMP/verified/.release-verification/trusted" --trusted-source-manifest "$RUNNER_TEMP/verified/.release-verification/source-manifest.json"
          mkdir -p "$RUNNER_TEMP/publication"
          cp -R "$RUNNER_TEMP/verified/dist" "$RUNNER_TEMP/publication/dist"

      - name: Seal publication bundle
        id: seal
        shell: bash
        run: |
          tar -C "$RUNNER_TEMP/publication" -cf "$RUNNER_TEMP/publication-release.tar" dist
          DIGEST="$(shasum -a 256 "$RUNNER_TEMP/publication-release.tar" | awk '{print $1}')"
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Transfer sealed publication bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-release-${{ env.RELEASE_COMMIT }}
          path: ${{ runner.temp }}/publication-release.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish exact verified assets
    needs:
      - prepare_publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download, verify, and publish sealed bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_BUNDLE_DIGEST: ${{ needs.prepare_publication.outputs.bundle_digest }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          [[ "$EXPECTED_BUNDLE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/source"
          git -C "$RUNNER_TEMP/source" init
          git -C "$RUNNER_TEMP/source" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$RUNNER_TEMP/source" fetch --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git -C "$RUNNER_TEMP/source" rev-parse "$RELEASE_TAG^{}")" = "$RELEASE_COMMIT"
          git -C "$RUNNER_TEMP/source" checkout --detach "$RELEASE_COMMIT"
          test "$(git -C "$RUNNER_TEMP/source" rev-parse HEAD)" = "$RELEASE_COMMIT"
          GITHUB_REF_NAME="$RELEASE_TAG" GITHUB_SHA="$RELEASE_COMMIT" bash "$RUNNER_TEMP/source/scripts/release-preflight.sh"
          mkdir -p "$RUNNER_TEMP/publisher-source"
          git -C "$RUNNER_TEMP/publisher-source" init
          git -C "$RUNNER_TEMP/publisher-source" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$RUNNER_TEMP/publisher-source" fetch --depth=1 origin "$WORKFLOW_COMMIT"
          git -C "$RUNNER_TEMP/publisher-source" checkout --detach "$WORKFLOW_COMMIT"
          test "$(git -C "$RUNNER_TEMP/publisher-source" rev-parse HEAD)" = "$WORKFLOW_COMMIT"
          DOWNLOAD_OK=false
          DOWNLOAD_DIR=""
          for ATTEMPT in 1 2 3 4 5 6; do
            DOWNLOAD_DIR="$RUNNER_TEMP/publication-download-$ATTEMPT"
            mkdir -p "$DOWNLOAD_DIR"
            if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "publication-release-$RELEASE_COMMIT" --dir "$DOWNLOAD_DIR"; then
              DOWNLOAD_OK=true
              break
            fi
            sleep 5
          done
          test "$DOWNLOAD_OK" = true
          test "$(shasum -a 256 "$DOWNLOAD_DIR/publication-release.tar" | awk '{print $1}')" = "$EXPECTED_BUNDLE_DIGEST"
          cd "$RUNNER_TEMP/source"
          env -u GH_TOKEN go run ./cmd/release-smoke --extract-bundle "$DOWNLOAD_DIR/publication-release.tar" --bundle-kind publication --destination "$RUNNER_TEMP/publication"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          RELEASE_COMMIT_TIMESTAMP="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          RELEASE_COMMIT_DATE="$(date -u -d "@$RELEASE_COMMIT_TIMESTAMP" +%Y-%m-%dT%H:%M:%SZ)"
          RELEASE_LDFLAGS="-s -w -X github.com/noahjenkins/unifi-cli/internal/buildinfo.Version=$RELEASE_VERSION -X github.com/noahjenkins/unifi-cli/internal/buildinfo.Commit=$RELEASE_COMMIT -X github.com/noahjenkins/unifi-cli/internal/buildinfo.BuildDate=$RELEASE_COMMIT_DATE"
          mkdir -p "$RUNNER_TEMP/publisher-trusted"
          for TARGET in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS="${TARGET%/*}"
            GOARCH="${TARGET#*/}"
            OUTPUT="$RUNNER_TEMP/publisher-trusted/${GOOS}_${GOARCH}/unifi"
            if [ "$GOOS" = windows ]; then
              OUTPUT="${OUTPUT}.exe"
            fi
            mkdir -p "$(dirname "$OUTPUT")"
            env -u GH_TOKEN CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "$RELEASE_LDFLAGS" -o "$OUTPUT" ./cmd/unifi
          done
          env -u GH_TOKEN go run ./cmd/release-smoke --write-source-manifest "$RUNNER_TEMP/publisher-source-manifest.json" --expected-commit "$RELEASE_COMMIT"
          env -u GH_TOKEN go run ./cmd/release-smoke --artifacts "$RUNNER_TEMP/publication/dist" --expected-version "$RELEASE_VERSION" --expected-commit "$RELEASE_COMMIT" --trusted-binaries "$RUNNER_TEMP/publisher-trusted" --trusted-source-manifest "$RUNNER_TEMP/publisher-source-manifest.json"
          GITHUB_REF_NAME="$RELEASE_TAG" GITHUB_SHA="$RELEASE_COMMIT" bash "$RUNNER_TEMP/publisher-source/scripts/publish-release.sh" "$RUNNER_TEMP/publication/dist" "$RUNNER_TEMP/source/docs/releases/v1.0.0-rc.1.md"
