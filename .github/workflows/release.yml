name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_verify:
    name: build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse published release replacement
        run: bash ./scripts/release-preflight.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build trusted all-target binaries and source manifest
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_COMMIT_TIMESTAMP="$(git show -s --format=%ct "$GITHUB_SHA")"
          RELEASE_COMMIT_DATE="$(date -u -d "@$RELEASE_COMMIT_TIMESTAMP" +%Y-%m-%dT%H:%M:%SZ)"
          RELEASE_LDFLAGS="-s -w -X github.com/noahjenkins/unifi-cli/internal/buildinfo.Version=$RELEASE_VERSION -X github.com/noahjenkins/unifi-cli/internal/buildinfo.Commit=$GITHUB_SHA -X github.com/noahjenkins/unifi-cli/internal/buildinfo.BuildDate=$RELEASE_COMMIT_DATE"
          mkdir -p "$RUNNER_TEMP/unifi-trusted"
          for TARGET in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS="${TARGET%/*}"
            GOARCH="${TARGET#*/}"
            OUTPUT="$RUNNER_TEMP/unifi-trusted/${GOOS}_${GOARCH}/unifi"
            if [ "$GOOS" = windows ]; then
              OUTPUT="${OUTPUT}.exe"
            fi
            mkdir -p "$(dirname "$OUTPUT")"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "$RELEASE_LDFLAGS" -o "$OUTPUT" ./cmd/unifi
          done
          go run ./cmd/release-smoke --write-source-manifest "$RUNNER_TEMP/unifi-source-manifest.json" --expected-commit "$GITHUB_SHA"

      - name: Install pinned Syft for archive SBOMs
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
        with:
          syft-version: v1.48.0

      - name: Build release artifacts without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --skip=publish --release-notes docs/releases/v1.0.0-rc.1.md

      - name: Verify local artifact set
        shell: bash
        run: go run ./cmd/release-smoke --artifacts dist --expected-version "${GITHUB_REF_NAME#v}" --expected-commit "$GITHUB_SHA" --trusted-binaries "$RUNNER_TEMP/unifi-trusted" --trusted-source-manifest "$RUNNER_TEMP/unifi-source-manifest.json"

      - name: Stage verification evidence
        shell: bash
        run: |
          mkdir -p .release-verification
          cp -R "$RUNNER_TEMP/unifi-trusted" .release-verification/trusted
          cp "$RUNNER_TEMP/unifi-source-manifest.json" .release-verification/source-manifest.json

      - name: Transfer verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-${{ github.sha }}
          path: |
            dist/
            .release-verification/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  attest:
    name: attest verified artifacts
    needs:
      - build_verify
      - smoke_artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release-${{ github.sha }}
          path: .

      - name: Reverify transferred release bundle
        shell: bash
        run: go run ./cmd/release-smoke --artifacts dist --expected-version "${GITHUB_REF_NAME#v}" --expected-commit "$GITHUB_SHA" --trusted-binaries .release-verification/trusted --trusted-source-manifest .release-verification/source-manifest.json

      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt

  smoke_artifacts:
    name: smoke ${{ matrix.goos }}/${{ matrix.goarch }} artifact
    needs: build_verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: windows-2025
            goos: windows
            goarch: amd64
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release-${{ github.sha }}
          path: .

      - name: Reverify transferred release bundle
        shell: bash
        run: go run ./cmd/release-smoke --artifacts dist --expected-version "${GITHUB_REF_NAME#v}" --expected-commit "$GITHUB_SHA" --trusted-binaries .release-verification/trusted --trusted-source-manifest .release-verification/source-manifest.json

      - name: Execute archived binary smoke contract
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="dist/unifi-cli_${RELEASE_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          EXECUTABLE="unifi"
          if [ "${{ matrix.goos }}" = windows ]; then
            ARCHIVE="dist/unifi-cli_${RELEASE_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
            EXECUTABLE="unifi.exe"
          fi
          SMOKE_DIR="$(mktemp -d)"
          tar -xf "$ARCHIVE" -C "$SMOKE_DIR"
          BINARY="$SMOKE_DIR/unifi-cli_${RELEASE_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}/$EXECUTABLE"
          go run ./cmd/release-smoke --binary "$BINARY" --expected-version "$RELEASE_VERSION" --expected-commit "$GITHUB_SHA"

  publish:
    name: publish exact verified assets
    needs:
      - build_verify
      - attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release-${{ github.sha }}
          path: .

      - name: Reverify transferred release bundle
        shell: bash
        run: go run ./cmd/release-smoke --artifacts dist --expected-version "${GITHUB_REF_NAME#v}" --expected-commit "$GITHUB_SHA" --trusted-binaries .release-verification/trusted --trusted-source-manifest .release-verification/source-manifest.json

      - name: Upload, read back, and publish exact assets
        run: bash ./scripts/publish-release.sh dist docs/releases/v1.0.0-rc.1.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
