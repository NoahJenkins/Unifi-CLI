name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 3
        with:
          go-version: 1.27.x
          check-latest: true
          cache-dependency-path: go.sum

      - name: download Go modules
        timeout-minutes: 5
        run: go mod download

      - name: smoke (build + vet + unit tests)
        shell: bash
        env:
          UNIFI_RACE: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: bash ./scripts/smoke.sh

      - name: enforce internal CLI coverage
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/check-coverage.sh

      - name: smoke native release executable
        run: go run ./cmd/release-smoke --native

      - name: cross-build and inspect all release targets
        if: runner.os == 'Linux'
        run: go run ./cmd/release-smoke --all

  vulnerability-scan:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action installs the current govulncheck and the newest Go 1.27 patch,
      # so neither needs a version bump here.
      - name: scan reachable Go vulnerabilities
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-input: 1.27.x
          check-latest: true
          cache-dependency-path: go.sum

  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/config
            target: FuzzStrictYAMLConfiguration
          - package: ./internal/client
            target: FuzzOfficialPaginationJSON
          - package: ./internal/client
            target: FuzzOfficialPathAndFilterEscaping
          - package: ./cmd/release-smoke
            target: FuzzReleaseBundleExtraction
          - package: ./cmd/release-smoke
            target: FuzzChecksumManifest
          - package: ./cmd/release-smoke
            target: FuzzSBOMSnapshotParsing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 3
        with:
          go-version: 1.27.x
          check-latest: true
          cache-dependency-path: go.sum

      - name: download Go modules
        timeout-minutes: 5
        run: go mod download

      - name: fuzz for 30 seconds
        run: go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=30s

  native-keyring:
    name: native keyring (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 3
        with:
          go-version: 1.27.x
          check-latest: true
          cache-dependency-path: go.sum

      - name: download Go modules
        timeout-minutes: 5
        run: go mod download

      - name: install Linux Secret Service
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring

      - name: test native credential store
        if: runner.os != 'Linux'
        env:
          UNIFI_NATIVE_KEYRING_IT: "1"
        run: go test ./internal/authstore -run TestNativeKeyringRoundTrip -count=1

      - name: test Linux Secret Service
        if: runner.os == 'Linux'
        shell: dbus-run-session -- bash --noprofile --norc -eo pipefail {0}
        run: |
          mkdir -p "$HOME/.cache" "$HOME/.local/share/keyrings"
          chmod 700 "$HOME/.local" "$HOME/.local/share/keyrings"
          printf '%s\n' 'unifi-cli-ci' | gnome-keyring-daemon --unlock
          UNIFI_NATIVE_KEYRING_IT=1 go test ./internal/authstore -run TestNativeKeyringRoundTrip -count=1

  # Single status for branch protection. Fuzzing is advisory on pull requests
  # (a crasher found by chance must not block unrelated changes) and gating on
  # push to main.
  ci:
    name: ci
    if: always()
    needs: [test, vulnerability-scan, fuzz, native-keyring]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require green jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          bad="$(jq -r --arg event "$EVENT" '
            to_entries[]
            | select(.value.result != "success")
            | select(.key != "fuzz" or $event != "pull_request")
            | "\(.key)=\(.value.result)"' <<<"$NEEDS")"
          if [[ -n "$bad" ]]; then
            echo "Not green: $bad" >&2
            exit 1
          fi
