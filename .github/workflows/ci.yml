name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependabot-policy:
    name: Dependabot policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 3
        with:
          node-version: '24'
      - run: node --test .github/scripts/*.test.cjs

  # GitHub expression string equality ignores case. Select on a hosted runner
  # so only the exact opt-in "true" can schedule a disposable Dell worker.
  runner-routing:
    name: select Linux CI runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux_runner: ${{ steps.select.outputs.linux_runner }}
    steps:
      - name: select Linux runner
        id: select
        shell: bash
        env:
          OPTIPLEX_CI_ENABLED: ${{ vars.OPTIPLEX_CI_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          linux_runner=ubuntu-latest
          if [[ "$OPTIPLEX_CI_ENABLED" == true ]] &&
             { [[ "$EVENT_NAME" == push ]] ||
               { [[ "$EVENT_NAME" == pull_request ]] && [[ "$HEAD_REPOSITORY" == "$REPOSITORY" ]]; }; }; then
            linux_runner=optiplex-ci-ubuntu24
          fi
          printf 'linux_runner=%s\n' "$linux_runner" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    needs: [runner-routing]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            runner: ${{ needs.runner-routing.outputs.linux_runner }}
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 3
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: download Go modules
        timeout-minutes: 5
        run: go mod download

      - name: smoke (build + vet + unit tests)
        shell: bash
        env:
          UNIFI_RACE: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: bash ./scripts/smoke.sh

      - name: test disposable guest identity proof
        if: runner.os == 'Linux'
        run: python3 scripts/test-dell-ci-canary.py

      - name: enforce internal CLI coverage
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/check-coverage.sh

      - name: smoke native release executable
        run: go run ./cmd/release-smoke --native

      - name: cross-build and inspect all release targets
        if: runner.os == 'Linux'
        run: go run ./cmd/release-smoke --all

  vulnerability-scan:
    name: govulncheck
    needs: [runner-routing]
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.runner-routing.outputs.linux_runner || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 3
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: download Go modules
        timeout-minutes: 5
        run: go mod download

      - name: scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  fuzz:
    name: fuzz (${{ matrix.target }})
    needs: [runner-routing]
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.runner-routing.outputs.linux_runner || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/config
            target: FuzzStrictYAMLConfiguration
          - package: ./internal/client
            target: FuzzOfficialPaginationJSON
          - package: ./internal/client
            target: FuzzOfficialPathAndFilterEscaping
          - package: ./cmd/release-smoke
            target: FuzzReleaseBundleExtraction
          - package: ./cmd/release-smoke
            target: FuzzChecksumManifest
          - package: ./cmd/release-smoke
            target: FuzzSBOMSnapshotParsing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 3
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: download Go modules
        timeout-minutes: 5
        run: go mod download

      - name: fuzz for 30 seconds
        run: go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=30s

  native-keyring:
    name: native keyring (${{ matrix.os }})
    needs: [runner-routing]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            runner: ${{ needs.runner-routing.outputs.linux_runner }}
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 3
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: download Go modules
        timeout-minutes: 5
        run: go mod download

      - name: install Linux Secret Service
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring

      - name: test native credential store
        if: runner.os != 'Linux'
        env:
          UNIFI_NATIVE_KEYRING_IT: "1"
        run: go test ./internal/authstore -run TestNativeKeyringRoundTrip -count=1

      - name: test Linux Secret Service
        if: runner.os == 'Linux'
        shell: dbus-run-session -- bash --noprofile --norc -eo pipefail {0}
        run: |
          mkdir -p "$HOME/.cache" "$HOME/.local/share/keyrings"
          chmod 700 "$HOME/.local" "$HOME/.local/share/keyrings"
          printf '%s\n' 'unifi-cli-ci' | gnome-keyring-daemon --unlock
          UNIFI_NATIVE_KEYRING_IT=1 go test ./internal/authstore -run TestNativeKeyringRoundTrip -count=1
