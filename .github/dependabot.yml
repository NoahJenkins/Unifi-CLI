version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    groups:
      # Module requirements only. The go directive stays at the minor and CI
      # always builds with the newest patch (setup-go 1.27.x), so no PR is needed.
      go-security:
        applies-to: security-updates
        patterns:
          - "*"
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # One weekly PR for every action bump, majors included.
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 3
